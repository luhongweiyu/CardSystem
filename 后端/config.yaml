数据库:
  username: cardcard
  password: cardcard
  dbname: gocard
  host: localhost
  port: 3306
网站:
  端口: 802
  # 反向代理与后端同机时保持默认即可；容器部署时填写实际代理网段。
  可信代理:
    - 127.0.0.1
    - "::1"
dev: true
管理员注册:
  # 默认关闭。注册请求最多每10分钟按需重新读取一次本文件，无需重启服务。
  启用: false
api:
  # 每个管理员的卡密接口整点重置；未配置时默认500000次。
  每小时请求上限: 500000
  # 管理接口请求体上限，默认2MB，可防止误提交超大内容。
  最大请求字节: 2097152
